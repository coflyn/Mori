name: Build Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Optional signing: add ANDROID_KEYSTORE_BASE64 (base64 of android/app/release.keystore).
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Collect APKs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" "dist-android/Mori-v${VERSION}-debug.apk"
          if [ "$SIGNED" = "true" ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$RELEASE_APK" "dist-android/Mori-v${VERSION}-release.apk"
          fi
          ls -lh dist-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-APK
          path: dist-android/*.apk
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
